schema_version: "1.0"
study:
  study_id: ductile-origami-warmstart
  protocol_version: 1.0.0
  parent_plan_path: study_docs/research/ductile-origami-warmstart-experiment-plan.md
  m00_design_path: study_docs/research/ductile-origami-warmstart/designs/m00-study-contract-observability-design.md
  base_contract_policy: immutable_after_first_use
  amendment_chain_path: study_docs/research/ductile-origami-warmstart/protocol/amendment-chain.jsonl
platform:
  target_architecture: gfx942
  target_status: unverified_target
  m00_execution:
    execution_kind: deterministic_cpu_fixture
    gpu_probe: forbidden
    rocm_probe: forbidden
    pythonhashseed: "0"
revisions:
  registry_path: study_docs/research/ductile-origami-warmstart/protocol/revision-registry.json
  component_states:
    geko: not_registered
    origami_formocast: not_registered
data_roles:
  roles:
    - pilot
    - development
    - development_guidance
    - development_judgment
    - final_holdout
  guidance_access_roles:
    - pilot
    - development
    - development_guidance
  judgment_role: development_judgment
  holdout_role: final_holdout
baseline:
  registry_path: study_docs/research/ductile-origami-warmstart/protocol/baseline-registry.json
  claim_kinds:
    - original_tuningdriver
    - geko_gfx942_proxy
  evidence_policy: strict_provenance
measurement:
  downstream_gpu:
    status: not_registered
  cpu_fixture:
    source: deterministic_cpu_fixture
    timeout_seconds: 10
    samples_per_shape: 1
    shapes:
      - shape_id: cpu-fixture-s0
        factor: 0.1
        role: non_comparative_fixture
      - shape_id: cpu-fixture-s1
        factor: 0.2
        role: non_comparative_fixture
search:
  sampling_jobs: 1
  max_iters: 100
  mating_max_iters: 100
  soo: false
  space:
    - name: a
      values: [1, 2, 3, 4]
    - name: b
      values: [2, 4, 6]
    - name: c
      values: [0, 1]
  operators:
    selection:
      name: tournament
      k: 2
      ratio: 0.5
      elitism: 0.0
      replacement: true
    crossover:
      name: ux
      probability: 0.9
      mode: random
    mutation:
      probability: 0.35
    survival: fitness
  scenarios:
    - scenario_id: fixed_horizon
      seed: 1701
      pop_size: 6
      n_gen: 4
      period: 0
      tolerance: 0.0
      diversity_threshold: 0.0
      split_generation: null
      evaluator_mode: formula
    - scenario_id: early_stop
      seed: 1702
      pop_size: 6
      n_gen: 7
      period: 2
      tolerance: 0.0
      diversity_threshold: 0.0
      split_generation: null
      evaluator_mode: flat
    - scenario_id: checkpoint_resume
      seed: 1703
      pop_size: 6
      n_gen: 4
      period: 0
      tolerance: 0.0
      diversity_threshold: 0.0
      split_generation: 2
      evaluator_mode: formula
guidance:
  status: not_registered
statistics:
  status: not_registered
criteria:
  - criterion_id: M00.ACC.OBS-SEMANTICS
    kind: acceptance
  - criterion_id: M00.ACC.RECONCILE
    kind: acceptance
  - criterion_id: M00.ACC.SPLIT-GUARD
    kind: acceptance
  - criterion_id: M00.ACC.BASELINE-GUARD
    kind: acceptance
  - criterion_id: M00.ACC.CONTRACT-LOCK
    kind: acceptance
  - criterion_id: M00.FAL.INSTRUMENTATION
    kind: falsification
  - criterion_id: M00.STOP.MISSING-EVIDENCE
    kind: stop
correctness:
  cpu_fixture:
    parser: strict_jsonl
    finite_values_required: true
  gpu:
    status: not_registered
locks:
  protocol_lock_path: study_docs/research/ductile-origami-warmstart/protocol/protocol-lock.json
  whitelist_path: study_docs/research/ductile-origami-warmstart/protocol/m00-whitelist.json
  registry_paths:
    shape: study_docs/research/ductile-origami-warmstart/protocol/shape-registry.csv
    baseline: study_docs/research/ductile-origami-warmstart/protocol/baseline-registry.json
    revision: study_docs/research/ductile-origami-warmstart/protocol/revision-registry.json
  protected_paths:
    - .claude/skills/implement-verify-loop/SKILL.md
    - .cursor/rules/hipblaslt-onboarding.mdc
    - .cursor/skills/implement-verify-loop/SKILL.md
    - CLAUDE.md
  final_report_path: study_docs/research/ductile-origami-warmstart/reports/m00-study-contract-observability-report.md
  report_lifecycle: independent_verifier_only
