  Recover only the Stage-1 entry gate by constructing a pinned Ductile-base,
  GEKO-utilities-only experimental integration, reproducing one actual gfx942
  non-StreamK Ductile YAML twice byte-for-byte, proving pinned Ductile
  consumption and three same-space sizes, then selecting one currently
  available gfx942 from three fresh read-only samples inside exact perlee before
  any effective lock or post-lock work.
