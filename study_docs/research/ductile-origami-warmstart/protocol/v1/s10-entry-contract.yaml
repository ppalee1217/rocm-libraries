  cv_p95_threshold: 0.005
  cap: 4
  complete_panel_required_per_level: true
  balanced_order_from_locked_seed: true
  delta_noise_formula: exp(P95(abs(log(Q_ar)-median_r(log(Q_ar)))))-1
decision:
  go_criterion: S1_ENTRY_GO
  go_edge: S1_ENTRY_GO -> S11
  requires_all_hard_gates: true
  ordered_gate_fields:
    - name
    - role
    - status
    - execution
    - reason_code
    - reason_text
    - failure_id
    - blocked_by
    - direct evidence
  statuses: [PASS, FAIL, INCONCLUSIVE, BLOCKED]
  executions: [complete, not_activated]
  separate_mapping_gates:
    - mapping_evidence_integrity
    - mapping_entry
  definitive_mapping_negative:
    earlier_gates: PASS/complete
    mapping_evidence_integrity: PASS/complete
    mapping_entry: FAIL/complete
    smoke: BLOCKED/not_activated/blocked_absent
    noise: BLOCKED/not_activated/blocked_absent
    scientific_outcome: negative
    criterion: S1_ENTRY_BLOCKED
    taxonomy: [FT-BLOCKED-MAPPING]
    edge: null
  blocked_absent:
    requires_canonical_and_raw_paths: true
    requires_blocked_by_and_must_be_absent: true
    artifact_hash_or_placeholder: forbidden
  negative_stop_raw:
    path: postlock/decision/negative-stop-raw.json
    exclusive: true
    role: decision evidence only
    binds:
      - effective lock and mapping hashes
      - derivation and stop-rule identity
      - runner, schema, and contract identities
      - pre/post smoke and noise absence rechecks
  terminal_command_refusal: [mapping, smoke, noise]
  proxy_partial_or_two_size_result: blocked-awaiting-user-decision
  prelock_failure_creates_no_lock_or_outcome: true
  postlock_negative_preserves_evidence_without_edge: true
raw_artifact_layout: >-
  All non-delivery source trees, builds, logs, command records, raw executor
