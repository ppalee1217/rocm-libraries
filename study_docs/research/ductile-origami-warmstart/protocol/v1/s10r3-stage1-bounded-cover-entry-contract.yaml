    - prelabel_explicit_scientific_resource_boundary
  nonmaterial_accounting_variance_blocks_progress: false

operational_blocker_policy:
  classification: durable_recoverable_operational_pause
  scientific_terminal: false
  checkpoint_complete: false
  path: study_docs/research/ductile-origami-warmstart/protocol/v1/evidence/s10r3-operational-blocker.json
  writer_role: main
  writer_exclusivity: true
  activation:
    requires_material_condition_from_resource_planning: true
    safe_atomic_boundary_required: true
    direct_condition_evidence_required: true
    completed_evidence_preserved: true
    unfavorable_result_discard_forbidden: true
    scientific_report_substitution_forbidden: true
  blocked_projection:
    execution_status: paused
    checkpoint_state: BLOCKED
    scientific_outcome: not_evaluated
    edge: null
  conditional_delivery: activated_only
  parent_projection_paths:
    - study_docs/research/surrogate-dse-plan.md
    - study_docs/research/ductile-origami-warmstart-experiment-plan.md
    - study_docs/research/ductile-origami-warmstart/README.md
    - study_docs/research/ductile-origami-warmstart/s10r3-stage1-bounded-cover-entry-recovery-design.md
  blocked_state_commit:
    exact_paths:
      - study_docs/research/surrogate-dse-plan.md
      - study_docs/research/ductile-origami-warmstart-experiment-plan.md
      - study_docs/research/ductile-origami-warmstart/README.md
      - study_docs/research/ductile-origami-warmstart/s10r3-stage1-bounded-cover-entry-recovery-design.md
      - study_docs/research/ductile-origami-warmstart/protocol/v1/evidence/s10r3-operational-blocker.json
    isolated_local_commit: true
    push: false
    required_trailers:
      - "Scientific-Gate: S10R3"
      - "Operational-State: BLOCKED"
      - "Scientific-Outcome: not_evaluated"
      - "Edge: null"
  resume:
    standing_authority_when_scientific_plan_unchanged: true
    user_decision_required_only_for_result_driven_scientific_plan_or_direction_change: true
    append_resumed_event_to_same_packet: true
    exact_commit_paths_equal_blocked_state_commit_paths: true
    condition_must_be_proven_cleared: true
    completed_evidence_remains_immutable: true
    same_effective_lock_allowed_only_if_all_bound_identities_unchanged: true
    binding_drift_requires_append_only_successor_effective_lock: true
    restored_state_rule: latest_valid_pre_block_execution_and_checkpoint_state
    post_resume_audit_required: true
  packet_json_schema:
    "$schema": "http://json-schema.org/draft-07/schema#"
    type: object
    additionalProperties: false
    required:
      - schema_version
      - packet_id
      - checkpoint_id
      - phase1_contract
      - effective_lock
      - state
      - scientific_outcome
      - edge
      - terminal_scientific
      - trigger
      - preserved_evidence
      - events
      - live_run_state
      - committed_projection_state
    properties:
      schema_version:
        type: integer
        const: 1
      packet_id:
        type: string
        const: S10R3-A46-OPERATIONAL-BLOCKER
      checkpoint_id:
        type: string
        const: S10R3
      phase1_contract:
        type: object
        additionalProperties: false
        required: [commit_oid, raw_sha256]
        properties:
          commit_oid:
            type: string
            pattern: "^[0-9a-f]{40}$"
          raw_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
      effective_lock:
        type: object
        additionalProperties: false
        required: [present, commit_oid, raw_sha256]
        properties:
          present:
            type: boolean
          commit_oid:
            type: [string, "null"]
            pattern: "^[0-9a-f]{40}$"
          raw_sha256:
            type: [string, "null"]
            pattern: "^[0-9a-f]{64}$"
      state:
        type: string
        enum: [blocked, resumed]
      scientific_outcome:
        type: string
        const: not_evaluated
      edge:
        type: "null"
      terminal_scientific:
        type: boolean
        const: false
      trigger:
        type: object
        additionalProperties: false
        required:
          - condition_id
          - detected_at_utc
          - safe_boundary
          - direct_evidence
        properties:
          condition_id:
            type: string
            enum:
              - unsafe_continuation
              - external_platform_or_allocation_limit
              - actual_compute_memory_or_storage_unavailable
              - full_workload_verification_closeout_or_artifact_preservation_impossible
              - label_dependent_stopping_or_selection
              - required_workload_or_claim_change
              - evidence_unverifiable
              - prelabel_explicit_scientific_resource_boundary
          detected_at_utc:
            type: string
            format: date-time
          safe_boundary:
            type: object
            additionalProperties: false
            required: [kind, phase, cursor]
            properties:
              kind:
                type: string
                enum: [pre_formal, atomic_chunk, atomic_cell, phase_boundary, closeout_boundary]
              phase:
                type: string
                minLength: 1
              cursor:
                type: [string, integer, "null"]
          direct_evidence:
            type: array
            minItems: 1
            maxItems: 64
            uniqueItems: true
            items:
              type: object
              additionalProperties: false
              required: [path_or_command, sha256_or_exit_code, observation]
              properties:
                path_or_command:
                  type: string
                  minLength: 1
                sha256_or_exit_code:
                  type: [string, integer]
                observation:
                  type: string
                  minLength: 1
      preserved_evidence:
        type: array
        maxItems: 4096
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [path, sha256, immutable]
          properties:
            path:
              type: string
              minLength: 1
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
            immutable:
              type: boolean
              const: true
      events:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: object
          additionalProperties: false
          required:
            - event_index
            - event_type
            - at_utc
            - reason
            - direct_evidence
            - state_before
            - state_after
            - authority
          properties:
            event_index:
              type: integer
              minimum: 0
            event_type:
              type: string
              enum: [blocked, resumed]
            at_utc:
              type: string
              format: date-time
            reason:
              type: string
              minLength: 1
            direct_evidence:
              type: array
              minItems: 1
              maxItems: 64
              uniqueItems: true
              items:
                type: object
                additionalProperties: false
                required: [path_or_command, sha256_or_exit_code, observation]
                properties:
                  path_or_command:
                    type: string
                    minLength: 1
                  sha256_or_exit_code:
                    type: [string, integer]
                  observation:
                    type: string
                    minLength: 1
            state_before:
              type: string
              enum: [DESIGN_APPROVED, LOCKED_READY, RUNNING, VERIFIED_PENDING_CLOSEOUT, BLOCKED]
            state_after:
              type: string
              enum: [BLOCKED, DESIGN_APPROVED, LOCKED_READY, RUNNING, VERIFIED_PENDING_CLOSEOUT]
            authority:
              type: string
              enum: [A46_material_condition_policy, user_result_driven_scientific_direction_decision]
      live_run_state:
        type: object
        additionalProperties: false
        required: [execution_status, checkpoint_state, last_complete_phase, resume_cursor]
        properties:
          execution_status:
            type: string
            enum: [not_started, paused, ready, running, verified_pending_closeout]
          checkpoint_state:
            type: string
            enum: [DESIGN_APPROVED, BLOCKED, LOCKED_READY, RUNNING, VERIFIED_PENDING_CLOSEOUT]
          last_complete_phase:
            type: [string, "null"]
          resume_cursor:
            type: [string, integer, "null"]
      committed_projection_state:
        type: object
        additionalProperties: false
        required: [head, execution_status, checkpoint_state, scientific_outcome, edge]
        properties:
          head:
            type: string
            pattern: "^[0-9a-f]{40}$"
          execution_status:
            type: string
            enum: [not_started, paused, ready, running, verified_pending_closeout]
          checkpoint_state:
            type: string
            enum: [DESIGN_APPROVED, BLOCKED, LOCKED_READY, RUNNING, VERIFIED_PENDING_CLOSEOUT]
          scientific_outcome:
            type: string
            const: not_evaluated
          edge:
            type: "null"
  semantic_validation_invariants:
    - event_indices_are_zero_based_contiguous_and_append_only
    - first_event_is_blocked
    - packet_state_equals_last_event_event_type
    - blocked_event_state_after_is_BLOCKED
    - resumed_event_state_before_is_BLOCKED_and_state_after_is_not_BLOCKED
    - last_event_state_after_equals_live_run_state_checkpoint_state
    - last_event_state_after_equals_committed_projection_state_checkpoint_state_after_isolated_commit
    - resumed_event_requires_direct_condition_clearance_evidence
    - effective_lock_null_fields_if_and_only_if_present_is_false
    - preserved_evidence_hashes_match_existing_immutable_bytes
    - parent_projection_matches_packet_state
    - phase2_operational_lineage_preserves_and_hash_binds_resumed_packet_instead_of_requiring_absence
    - no_scientific_outcome_report_completion_or_edge_created
    - no_completed_unfavorable_evidence_deleted_or_replaced

verifier_oracle:
  fresh_verifier_required: true
  implementer_report_is_ground_truth: false
  headline_reproduction: independently_reproduce_complete_contract_decision_from_direct_evidence
  required_checks:
    - phase1_and_phase2_hash_and_authority_integrity
    - plan_b_contract_parity
    - complete_fixed_schedule_and_no_partial_completion
    - fresh_registry_seed_ledger_and_forbidden_reuse_absence
    - bounded_cover_and_exact_K_reproduction
    - mapping_A_B_and_field_provenance_reproduction
    - native_and_runtime_fault_reproduction
    - correctness_and_noise_completeness
    - canonical_outcome_and_edge_reproduction
    - implementation_and_delivery_whitelist
  unacceptable_fallbacks:
    - partial_timeout_killed_or_still_running_as_complete
    - trusting_implementer_summary_without_fresh_reproduction
    - changing_test_threshold_fixture_workload_metric_goal_or_claim_to_pass
    - proxy_baseline_or_evidence_source
    - fewer_draws_targets_rows_cells_repeats_or_sizes
    - outcome_dependent_schedule_seed_target_selector_or_rerun
    - old_s10r1_s10r2_or_deleted_s10r3_evidence
    - guessed_mapping_field_or_replacement
    - independent_oracle_substituted_for_native_path
    - unbound_implementation_or_pending_effective_lock
    - downstream_s11_implementation_or_evidence

terminalization:
  technical_pass_state: VERIFIED_PENDING_CLOSEOUT
  checkpoint_complete_requires:
    - formal_report
    - parent_and_index_projection
    - closeout_ack
    - exact_path_terminal_commit
    - post_commit_audit
  positive_negative_and_inconclusive_all_require_terminal_report: true
  changes_required_is_scientific_report: false
  operational_blocked_uses_packet_not_scientific_report: true
  operational_blocked_is_recoverable_not_checkpoint_complete: true
  only_post_audited_positive_activates_s11: true
