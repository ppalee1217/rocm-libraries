seed_protocol:
  namespace_label: "S10R3|A45|clean-restart|2026-07-30|v1"
  namespace_sha256: 6cff1a13675818285047f6b64d97c7918bd0453974623d9ede59cb313be79ca6
  derivation:
    algorithm: sha256_domain_separated_u64_be
    input_fields:
      - namespace_label_utf8
      - stream_id_utf8
      - conditional_atom_id_or_GLOBAL_utf8
      - chunk_index_u64_be
      - draw_index_u64_be
    output: first_8_digest_bytes_as_unsigned_big_endian_integer
  disjointness_rule:
    checkpoint_and_amendment_domain_separation_required: true
    seed_retry_forbidden: true
    old_seed_import_forbidden: true

candidate_atom_registry:
  output_path: study_docs/research/ductile-origami-warmstart/protocol/v1/manifests/s10r3-candidate-atom-registry.json
  created_before_first_draw: true
  source: fresh_rebuild_from_pinned_source_and_actual_yaml
  required_fields:
    - atom_id
    - axis_name
    - typed_value
    - canonical_value_bytes
    - yaml_pointer
    - source_symbol_and_blob
    - nominal_role_flags
    - operational_semantic_category
    - deterministic_priority
    - conditional_eligibility
  prelocked_candidate_atom_rule: all_values_of_ungrouped_and_currently_unweighted_and_frozen_free_residual_axes_with_cardinality_greater_than_1
  conditional_diagnostic_atom_rule:
    - all_prelocked_candidate_atoms
    - first_and_last_candidate_of_each_axis
    - exact_typed_integer_minus_2_or_minus_1
  conditional_priority_tuple:
    - sentinel_rank
    - axis_scope_rank
    - boundary_rank
    - axis_index
    - value_index
    - atom_id

support_protocol:
  validator: pinned_ductile_valid_fn
  states:
    supported_witnessed: at_least_one_fresh_complete_accepted_config_contains_value
    support_unobserved: no_fresh_witness_in_fixed_schedule_and_no_complete_absence_proof
    support_proven_absent: finite_exhaustive_or_sound_constraint_or_independently_validated_complete_proof
  stochastic_zero_implies_proven_absent: false
  gene_guidance_eligibility: every_value_must_be_supported_witnessed
  unsupported_or_unobserved_gene_blocks_other_genes_or_entry: false
  baseline_yaml_semantics_unchanged: true

discovery_schedule:
  chunk_size_draws: 512
  global_stream:
    chunks: 32
    draws: 16384
    early_stop: false
  conditional_activation:
    occurs_after_complete_global: true
    target_rule: highest_prelocked_priority_atoms_still_support_unobserved
    maximum_targets: 15
  each_activated_conditional:
    chunks: 32
    draws: 16384
    fixed_atom_on_every_draw: true
    early_stop: false
  total:
    maximum_chunks: 512
    maximum_draws: 262144
  forbidden:
    - seed_retry
    - target_replacement
    - extension
    - old_row_reuse
    - outcome_dependent_priority
    - outcome_dependent_schedule
    - redraw_completed_chunk
  interruption:
    safe_boundary: atomic_complete_chunk
    resume_requires_same_phase1_contract_and_effective_lock: true
    append_only_ledger: true

bounded_cover_selector:
  mandatory_mapping_atoms: prelocked_candidate_atoms_intersection_supported_witnessed
  always_required_structural_atoms: []
  selector_id: deterministic_greedy_set_cover_v2_bounded_k20
  occurrence_order:
    - stream_rank
    - conditional_priority_rank
    - chunk_index
    - draw_index
    - config_hash
  step_rule: select_config_with_maximum_gain_over_remaining_mandatory_atoms
  tie_break:
    - first_occurrence_order
    - config_hash
  c_greedy_semantics: frozen_greedy_full_cover_cardinality_not_mathematical_minimum
  k_rule: max_10_and_c_greedy
  k_maximum: 20
  pad_when_c_greedy_less_than_10: first_occurrence_order_from_remaining_fresh_distinct_witnesses
  final_order: config_hash_ascending
  inconclusive_conditions:
    - fresh_distinct_valid_witnesses_less_than_10
    - greedy_does_not_cover_all_mandatory_atoms
    - c_greedy_greater_than_20
  post_label_solver_or_cap_change_forbidden: true
  non_gating_lower_bound:
    formula: maximum_fresh_witnessed_mandatory_value_count_on_any_single_residual_axis
    id: L_axis
    disclosure_if_l_axis_at_most_20_and_greedy_over_cap: global_minimum_cover_feasibility_not_evaluated

mapping_protocol:
  corpus_size: exact_K
  passes:
    - id: A
      required_rows: 3_times_K
    - id: B
      required_rows: 3_times_K
      fresh: true
  maximum_rows_per_pass: 60
  required_parity:
    - raw_config
    - resolved_solution
    - canonical_hash
    - size_mapping
    - formocast_input
    - required_field_provenance
  forbidden:
    - guessed_required_field
    - unresolved_required_field
    - mapping_failure
    - replacement
    - proxy
    - config_K_plus_1

native_conformance:
  score_blind_fixture_required: true
  fixture_prelocked_before_labels: true
  native_path_required: "origami::Formocast::predictedPerformance() const"
  runtime_paths_required:
    - "SolutionIterator::checkSolution(ContractionSolution&, ContractionProblemGemm&, bool)"
    - "AllSolutionsIterator::preProblem"
  required_semantics:
    - source_guard_first_true_order
    - early_terminate_pair
    - stable_sort
    - ties
    - threshold_index_and_value
    - queue_prefix
  independent_oracle_can_replace_native: false
  fail_closed_faults:
    - native_helper_binary_or_path
    - source_blob_or_guard_order
    - host_adapter
    - runtime_check_solution_or_queue_semantics
  harness_schema_adapter_guard_or_queue_defect_outcome: CHANGES_REQUIRED

gpu_and_measurement:
  container: perlee
  other_containers_forbidden: true
  container_start_stop_restart_recreate_forbidden: true
  dependency_install_forbidden: true
  architecture: gfx942
  card_selection:
    rule: choose_any_currently_free_eligible_gfx942_card_at_each_gpu_phase
    reservation_required: false
    exclusivity_claimed: false
    foreign_pid_rejection: true
    identity_capture_required: true
  interruption:
    safe_boundary: atomic_complete_cell
    completed_cells_immutable: true
    append_only_resume: true
    unfavorable_result_discard_forbidden: true
  anchors:
    source: final_K_config_hashes_sorted_ascending
    indices:
      - 0
      - floor_of_K_minus_1_divided_by_2
      - K_minus_1
    replacement: false
  correctness:
    anchors: 3
    sizes: 3
    total_cells: 9
    requirements:
      - generate
      - compile
      - smoke
      - nonzero_correctness
    all_must_pass_before_noise: true
  noise:
    anchors: 3
    sizes: 3
    repeats: 7
    total_cells: 63
    reduce_fn: max
    cv_p95_maximum_percent: 0.5
    delta_noise: parent_definition

criteria:
  - id: S10R3-C01
    description: phase1_and_phase2_authority_lineage_and_lock_integrity
  - id: S10R3-C02
    description: fresh_registry_seed_ledger_and_no_forbidden_evidence_reuse
  - id: S10R3-C03
    description: complete_fixed_support_discovery_and_three_state_classification
  - id: S10R3-C04
    description: deterministic_bounded_cover_selector_and_exact_K_corpus
  - id: S10R3-C05
    description: exact_3K_mapping_A_B_and_field_provenance
  - id: S10R3-C06
    description: native_formocast_and_runtime_queue_conformance_with_fault_tests
  - id: S10R3-C07
    description: nine_cell_generate_compile_smoke_nonzero_correctness
  - id: S10R3-C08
    description: complete_63_cell_noise_panel_and_threshold
  - id: S10R3-C09
    description: canonical_decision_and_independent_reproduction
  - id: S10R3-C10
    description: fresh_verifier_full_goal_alignment_and_terminal_closeout

outcome_matrix:
  - id: positive
    condition: all_required_criteria_and_closeout_pass
    scientific_outcome: positive
    criterion_id: S1_ENTRY_GO
    failure_id: null
    edge: S11
    report: required
    positive_gate_record: required
  - id: negative_mapping
    condition: valid_bounded_K_exists_but_required_mapping_or_field_provenance_reproducibly_fails
    scientific_outcome: negative
    criterion_id: S1_ENTRY_BLOCKED
    failure_id: FT-BLOCKED-MAPPING
    edge: null
    report: required
  - id: negative_correctness
    condition: locked_generate_compile_smoke_or_nonzero_correctness_reproducibly_fails_with_harness_and_identity_intact
    scientific_outcome: negative
    criterion_id: S1_ENTRY_BLOCKED
    failure_id: FT-BLOCKED-CORRECTNESS
    edge: null
    report: required
  - id: inconclusive
    condition: witness_floor_or_bounded_cover_or_noise_stability_condition_fails
    scientific_outcome: inconclusive
    criterion_id: null
    failure_id: FT-INCONCLUSIVE
    edge: null
    report: required
  - id: changes_required
    condition: harness_schema_api_guard_queue_lineage_or_implementation_defect
    scientific_outcome: not_evaluated
    criterion_id: CHANGES_REQUIRED
    failure_id: null
    edge: null
    report: forbidden_until_terminal_scientific_outcome
  - id: operational_blocked
    condition: material_safety_availability_completion_or_evidence_boundary
    scientific_outcome: not_evaluated
    criterion_id: BLOCKED
    failure_id: null
    edge: null
    report: operational_packet_required_no_scientific_report
    scientific_terminal: false
    resume_allowed: true

formal_execution_order:
  steps:
    - cpu_support_discovery
    - support_classification_seal
    - bounded_exact_K_selection
    - mapping_A_B
    - native_sentinel_runtime_conformance
    - gpu_environment_identity
    - smoke_correctness
    - noise
    - decision
    - independent_reproduction_and_fresh_verification
    - terminal_closeout
  stop_on_first_terminal_outcome_or_repair_gate: true
  later_phase_before_prior_pass_forbidden: true

