                  checks:
                    properties:
                      exact_path_mode_hash_and_binary_binding:
                        const: FAIL
              - properties:
                  checks:
                    properties:
                      source_yaml_registry_fixture_parity:
                        const: FAIL
              - properties:
                  checks:
                    properties:
                      role_counter_and_whitelist_parity:
                        const: FAIL
              - properties:
                  checks:
                    properties:
                      outcome_artifact_absence:
                        const: FAIL
              - properties:
                  checks:
                    properties:
                      canonical_self_hash:
                        const: FAIL
              - properties:
                  findings:
                    minItems: 1
