            type: string
            enum: [PASS, FAIL]
          exact_path_mode_hash_and_binary_binding:
            type: string
            enum: [PASS, FAIL]
          source_yaml_registry_fixture_parity:
            type: string
            enum: [PASS, FAIL]
          role_counter_and_whitelist_parity:
            type: string
            enum: [PASS, FAIL]
          outcome_artifact_absence:
            type: string
            enum: [PASS, FAIL]
