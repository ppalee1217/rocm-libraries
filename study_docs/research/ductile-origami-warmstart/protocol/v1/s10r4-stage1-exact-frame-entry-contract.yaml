outcome_document_policy:
  immutable_after_phase1_seal:
    - all_six_committed_A47_authority_Git_objects_at_authority_commit
    - scientific_projection_criteria_thresholds_claim_and_edge_of_all_six_authority_paths
    - phase1_contract_bytes
  terminal_authority_updates_allowed_only_for:
    - mechanically_derived_current_lifecycle_status_fields
    - mechanically_derived_outcome_failure_edge_and_report_link_fields
    - factual_closeout_projection_prose_that_does_not_change_science
  immutable_after_phase2_seal:
    - all_phase2_implementation_schema_test_registry_fixture_and_lock_bytes
  common_scientific_terminal_required:
    - s10r4_codegen_classification_if_census_completed
    - s10r4_operational_selection_if_census_completed
    - s10r4_decision
    - s10r4_terminal_formal_report
    - fresh_verifier_verdict
    - closeout_ack
    - exact_path_commit_and_post_commit_audit
  by_outcome:
    positive:
      required:
        - s10r4_codegen_classification
        - s10r4_operational_selection
        - s10r4_mapping_corpus_PASS
        - s10r4_sentinel_conformance_PASS
        - s10r4_environment_PASS
        - s10r4_smoke_correctness_PASS
        - s10r4_noise_pilot_PASS
        - s10r4_decision_positive
        - s10r4_positive_gate_record
        - s10r4_terminal_formal_report
      forbidden:
        - s10r4_operational_blocker
    negative_mapping:
      required:
        - s10r4_codegen_classification
        - s10r4_operational_selection
        - s10r4_mapping_corpus_terminal_record_if_mapping_was_reached
        - s10r4_decision_negative_mapping
        - s10r4_terminal_formal_report
      forbidden:
        - s10r4_positive_gate_record
        - s10r4_operational_blocker
        - native_GPU_correctness_or_noise_documents_after_pre_mapping_terminal
    negative_correctness:
      required:
        - s10r4_codegen_classification
        - s10r4_operational_selection
        - s10r4_mapping_corpus_PASS
        - s10r4_sentinel_conformance_PASS
        - s10r4_environment_PASS
        - s10r4_smoke_correctness_terminal_record
        - s10r4_decision_negative_correctness
        - s10r4_terminal_formal_report
      forbidden:
        - s10r4_noise_pilot
        - s10r4_positive_gate_record
        - s10r4_operational_blocker
    inconclusive_noise:
      required:
        - s10r4_codegen_classification
        - s10r4_operational_selection
        - s10r4_mapping_corpus_PASS
        - s10r4_sentinel_conformance_PASS
        - s10r4_environment_PASS
        - s10r4_smoke_correctness_PASS
        - s10r4_noise_pilot_complete_FAIL
        - s10r4_decision_inconclusive
        - s10r4_terminal_formal_report
      forbidden:
        - s10r4_positive_gate_record
        - s10r4_operational_blocker
    changes_required:
      required:
        - append_only_finding_and_direct_evidence_in_transient_governance_scope
      forbidden:
        - s10r4_decision
        - s10r4_positive_gate_record
        - s10r4_terminal_formal_report
        - s10r4_operational_blocker_unless_a_separate_material_external_block_exists
    operational_blocked:
      required:
        - s10r4_operational_blocker_only
      forbidden:
        - s10r4_decision
        - s10r4_positive_gate_record
        - s10r4_terminal_formal_report
  unreached_documents: must_be_absent
  placeholder_or_prefilled_outcome_document: forbidden

lifecycle_state_machine:
  initial_after_A47_authority_commit:
    design_status: approved
    execution_status: not_started
    checkpoint_state: DESIGN_APPROVED
    scientific_outcome: not_evaluated
    lock_state: absent
    edge: null
  after_phase1_contract_commit_and_post_audit:
    design_status: approved
    execution_status: not_started
    checkpoint_state: DESIGN_APPROVED
    scientific_outcome: not_evaluated
    lock_state: absent
    edge: null
  after_phase2_binding_commit_before_post_audit:
    design_status: approved
    execution_status: blocked
    checkpoint_state: BLOCKED
    scientific_outcome: not_evaluated
    lock_state: absent
    edge: null
    formal_evidence_allowed: false
  after_phase2_post_commit_audit_PASS:
    design_status: approved
    execution_status: ready
    checkpoint_state: LOCKED_READY
    scientific_outcome: not_evaluated
    lock_state: effective
    edge: null
    formal_evidence_allowed: true
  during_formal_execution:
    design_status: approved
    execution_status: running
    checkpoint_state: RUNNING
    scientific_outcome: not_evaluated
    lock_state: effective
    edge: null
  after_machine_scientific_decision_before_fresh_verification:
    design_status: approved
    execution_status: completed
    checkpoint_state: RUNNING
    verification_status: RESULT_PENDING_FRESH_VERIFICATION
    scientific_outcome: one_of_positive_negative_inconclusive
    lock_state: effective
    edge: positive_internal_qualified_token_only_else_null
  changes_required:
    design_status: approved
    execution_status: blocked
    checkpoint_state: BLOCKED
    scientific_outcome: not_evaluated
    lock_state: effective_if_phase2_was_post_audited_else_absent
    edge: null
  operational_blocked:
    design_status: approved
    execution_status: blocked
    checkpoint_state: BLOCKED
    scientific_outcome: not_evaluated
    lock_state: effective_if_phase2_was_post_audited_else_absent
    edge: null
  after_fresh_technical_PASS_before_closeout_commit:
    design_status: approved
    execution_status: completed
    checkpoint_state: VERIFIED_PENDING_CLOSEOUT
    scientific_outcome: one_of_positive_negative_inconclusive
    lock_state: effective
    edge: positive_internal_qualified_token_only_else_null
  after_terminal_exact_commit_and_post_commit_audit:
    design_status: approved
    execution_status: completed
    checkpoint_state: CHECKPOINT_COMPLETE
    scientific_outcome: one_of_positive_negative_inconclusive
    lock_state: effective
    edge: positive_S10R4_qualified_edge_only_else_null
  technical_PASS_is_not_CHECKPOINT_COMPLETE: true
  scientific_edge_is_not_external_until_terminal_post_commit_audit: true

downgrade_policy:
  blocked_awaiting_user_decision_for_any_reduction_of:
    - exact_114_config_frame
    - two_complete_codegen_passes_or_228_terminal_children
    - native_membership_or_classification_requirements
    - mandatory_atom_set_or_K_rule_or_K_max
    - mapping_pass_rows_or_parity_or_failure_reproduction
    - native_fixture_or_fault_substitution
    - GPU_identity_or_9_correctness_cells
    - 9_groups_times_7_repeats_or_noise_formulas_or_threshold
    - timeout_or_validation_requirements
    - outcome_matrix_or_document_policy
    - independent_reproduction_or_fresh_verification
    - claim_scope_or_qualified_edge
  partial_evidence_may_satisfy_scientific_outcome_or_edge: false
  diagnostic_or_reduced_mode_edge: null
  only_design_discussion_plus_user_decision_can_amend: true

