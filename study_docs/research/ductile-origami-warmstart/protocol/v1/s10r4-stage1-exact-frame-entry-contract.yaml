      - study_docs/research/ductile-origami-warmstart/protocol/v1/locks/s10r4-stage1-exact-frame-entry-lock.json
      - projects/hipblaslt/tensilelite/Tensile/Tests/unit/test_ductile_s10r4_entry.py
    required_audit_verdict: AUDIT_PASS_POST_BINDING
    post_commit_audit_required: true
    required_lock_state_after_post_audit: effective
    required_execution_status_after_post_audit: ready
    required_checkpoint_state_after_post_audit: LOCKED_READY
