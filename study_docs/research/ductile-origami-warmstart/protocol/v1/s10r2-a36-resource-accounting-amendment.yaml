schema_version: 1
amendment_id: S10R2-A36-RESOURCE-ACCOUNTING-MATERIALITY
authority_date: "2026-07-29"
risk_tier: R3
authority_source: explicit_user_direction
purpose: >-
  Keep resource telemetry proportional to its actual effect on scientific
  validity and avoid rerunning completed outcome-bearing work solely to perfect
  non-material resource accounting.

resource_materiality:
  default_role: operational_safety_and_planning_control
  scientific_estimand_by_default: false
  blocking_conditions:
    - direct_or_material_evidence_of_frozen_cap_exceed
    - unsafe_continuation
    - label_dependent_stopping_or_selection
    - incomplete_required_workload
    - corrupted_or_unverifiable_scientific_evidence
  non_blocking_conditions_required:
    - fixed_workload_complete
    - schedule_and_append_only_evidence_chain_verified
    - headline_result_independently_reproduced
    - no_label_driven_stopping_or_selection
    - no_direct_evidence_of_cap_exceed
  non_blocking_action:
    - record_technical_caveat
    - improve_telemetry_prospectively_when_material
    - do_not_rerun_outcome_bearing_work_only_for_accounting

